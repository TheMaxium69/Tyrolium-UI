<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyrolium - En maintenance</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .maintenance-container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 15px 0;
            color: #212529;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #6c757d;
            margin: 0 0 15px 0;
        }
        .last-p {
            margin-bottom: 0;
            font-weight: bold;
        }
        .brand {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="maintenance-container">
    <div class="icon">🚧</div>
    <h1>Maintenance en cours</h1>
    <p>Nous effectuons actuellement quelques mises à jour sur notre serveur pour améliorer votre expérience sur <span class="brand">Tyrolium</span>.</p>
    <p class="last-p">Merci de votre patience, l'équipe Tyrolium sera de retour très vite !</p>
</div>

</body>
</html>
