# ══════════════════════════════════════════════════════════════════
# {{SITE}} — Nginx ({{MODE}})
# Généré par scripts/tyrobuild.mjs : ne pas modifier dans prod/,
# modifier scripts/server-config/nginx.conf puis relancer tyrobuild.
#
# Fragment à inclure DANS le bloc server { } du site (/etc/nginx/sites-available/{{CONF_NAME}}) :
#
#   server {
#       server_name {{DOMAIN}};{{LISTEN_HINT}}
#       root {{ROOT}};
#       index {{INDEX}};
#
#       include {{ROOT}}/.tyro-nginx.conf;
#
#       … gzip, lignes "managed by Certbot" : restent dans le bloc server
#   }
#
# Ce fragment gère : fichiers cachés, routage Angular, pages d'erreur (vrais codes HTTP){{PHP_HINT}}, cache navigateur.
# La compression (gzip) reste dans le bloc server.
# → retirer du bloc server les "location /", "location ~ /\." , "error_page", le bloc de cache{{PHP_REMOVE}} qu'il avait déjà
# → vérifier puis recharger : nginx -t && systemctl reload nginx
# ══════════════════════════════════════════════════════════════════

charset utf-8;
autoindex off;
{{EXTRA}}
# Fichiers cachés (.git, .gitignore, ce fichier…) : jamais servis
location ~ /\.(?!well-known/) {
    return 404;
}

{{ROUTING}}{{PHP}}
# ── Cache navigateur ───────────────────────────────────────────────
# Fichiers du build avec un code dans le nom (main-XXXXXXXX.js, styles-…css, polices de media/) :
# leur nom change dès que leur contenu change → gardés 1 an, sans jamais redemander
location ~ -[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Images, polices, médias sans code dans le nom : 7 jours
# (un fichier remplacé sous le même nom est vu par tous au plus tard une semaine après)
location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|mp4|webm|m4a|mp3|pdf)$ {
    expires 7d;
    access_log off;
}
