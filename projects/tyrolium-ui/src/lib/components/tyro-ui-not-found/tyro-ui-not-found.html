<section class="nf-section">

  <div class="nf-deco">
    <div class="nf-deco-blob nf-deco-blob--1"></div>
    <div class="nf-deco-blob nf-deco-blob--2"></div>
  </div>

  <div class="nf-inner">

    <div class="nf-badge">
      <span class="nf-badge-dot"></span>
      Erreur 404
    </div>

    <p class="nf-code">404</p>

    <div class="nf-sep"></div>

    <h1>Page introuvable</h1>

    <p class="nf-desc">
      La page que vous cherchez n'existe pas ou a été déplacée.<br>
      Vérifiez l'URL ou revenez à l'accueil.
    </p>

    <div class="nf-actions">
      <a [routerLink]="homeLink" class="nf-btn-primary">
        <i class="ri-home-4-line"></i>
        {{ homeLabel }}
      </a>
      <button class="nf-btn-secondary" (click)="goBack()">
        <i class="ri-arrow-left-line"></i>
        Page précédente
      </button>
    </div>

  </div>

</section>
