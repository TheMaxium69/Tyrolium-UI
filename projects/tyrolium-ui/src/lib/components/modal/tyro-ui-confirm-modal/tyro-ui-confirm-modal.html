@if (state) {
  <div class="cm-overlay" (click)="onOverlayClick($event)">
    <div class="cm-card" [class.cm-card--danger]="state.type === 'danger'">
      <button type="button" class="cm-x" (click)="svc.answer(false)">
        <i class="ri-close-line"></i>
      </button>

      <div class="cm-icon-wrap" [class.cm-icon-wrap--danger]="state.type === 'danger'">
        <i [class]="icon + ' cm-icon'"></i>
      </div>

      <h3 class="cm-title">{{ state.title }}</h3>
      <p class="cm-message">{{ state.message }}</p>

      <div class="cm-actions">
        <button type="button" class="cm-btn cm-btn--cancel" (click)="svc.answer(false)">
          {{ state.cancelLabel || 'Annuler' }}
        </button>
        <button type="button" class="cm-btn cm-btn--confirm" [class.cm-btn--danger]="state.type === 'danger'" (click)="svc.answer(true)">
          {{ state.confirmLabel || 'Confirmer' }}
        </button>
      </div>
    </div>
  </div>
}
