@if (auth.modalOpen()) {
  <div class="auth-overlay" (click)="onOverlayClick($event)">
    <div class="auth-card">

      <!-- Close -->
      <button class="auth-close" (click)="auth.closeModal()" [attr.aria-label]="lang() === 'en' ? 'Close' : 'Fermer'">
        <i class="ri-close-line"></i>
      </button>

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <img src="/assets/tyrolium-ui/projects/Useritium.png" alt="Useritium" class="auth-logo-img"
               onerror="this.style.display='none'">
          <span class="auth-logo-fallback">U</span>
        </div>
        <h2 class="auth-title">Useritium</h2>
        <p class="auth-subtitle">
          {{ lang() === 'en'
            ? 'Your universal Tyrolium identity'
            : 'Votre identité universelle Tyrolium' }}
        </p>
      </div>

      <!-- Form -->
      <form class="auth-form" (submit)="submit($event)">

        <div class="auth-field">
          <label>{{ lang() === 'en' ? 'E-mail or username' : 'E-mail ou nom d\'utilisateur' }}</label>
          <input type="text" [(ngModel)]="login" name="login"
                 [placeholder]="lang() === 'en' ? 'you@example.com or username' : 'vous@exemple.fr ou nom d\'utilisateur'"
                 autocomplete="username" required>
        </div>

        <div class="auth-field">
          <label>{{ lang() === 'en' ? 'Password' : 'Mot de passe' }}</label>
          <div class="auth-pass-wrap">
            <input [type]="showPass ? 'text' : 'password'" [(ngModel)]="password" name="password"
                   [placeholder]="lang() === 'en' ? 'Your password' : 'Votre mot de passe'"
                   autocomplete="current-password" required>
            <button type="button" class="auth-pass-toggle" (click)="showPass = !showPass">
              <i [class]="showPass ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
            </button>
          </div>
        </div>

        @if (auth.error()) {
          <p class="auth-error">
            <i class="ri-error-warning-line"></i>
            {{ auth.error() }}
          </p>
        }

        <button type="submit" class="auth-submit" [disabled]="auth.loading()">
          @if (auth.loading()) {
            <i class="ri-loader-4-line auth-spinner"></i>
          }
          {{ auth.loading()
            ? (lang() === 'en' ? 'Signing in…' : 'Connexion…')
            : (lang() === 'en' ? 'Sign in' : 'Se connecter') }}
        </button>

      </form>

      <!-- Footer -->
      <p class="auth-footer">
        {{ lang() === 'en'
          ? 'Free · Hosted in France · Never sold'
          : 'Gratuit · Hébergé en France · Jamais vendu' }}
      </p>

    </div>
  </div>
}
