<div class="ag-group">
  @for (av of visible; track $index) {
    <div class="ag-item" [class]="'ag-item--' + size">
      <tyro-ui-avatar [src]="av.src" [name]="av.name" [size]="size"></tyro-ui-avatar>
    </div>
  }
  @if (overflow > 0) {
    <div class="ag-overflow" [class]="'ag-overflow--' + size">
      +{{ overflow }}
    </div>
  }
</div>
