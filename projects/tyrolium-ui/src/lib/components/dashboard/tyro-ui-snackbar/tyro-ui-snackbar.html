@if (active) {
  <div [class]="positionClass">
    <div [class]="typeClass" role="alert">
      <i [class]="icon + ' sn-icon'"></i>
      <div class="sn-body">
        @if (active.title) {
          <span class="sn-title">{{ active.title }}</span>
        }
        <span class="sn-message">{{ active.message }}</span>
      </div>
      <button type="button" class="sn-close" (click)="svc.dismiss()">
        <i class="ri-close-line"></i>
      </button>
    </div>
  </div>
}
