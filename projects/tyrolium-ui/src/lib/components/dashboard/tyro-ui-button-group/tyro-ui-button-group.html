<div [class]="groupClass">
  @for (item of items; track item.value; let first = $first; let last = $last) {
    <button
      type="button"
      class="btg-item"
      [class.btg-item--first]="first"
      [class.btg-item--last]="last"
      [class.btg-item--active]="isActive(item.value)"
      [disabled]="item.disabled"
      (click)="select(item)">
      @if (item.icon) {
        <i [class]="item.icon + ' btg-icon'"></i>
      }
      <span>{{ item.label }}</span>
    </button>
  }
</div>
