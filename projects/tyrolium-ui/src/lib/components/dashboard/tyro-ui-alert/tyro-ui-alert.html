@if (!isClosed) {
  <div class="al-alert" [class]="'al-alert--' + type">
    <i [class]="icon + ' al-icon'"></i>
    <div class="al-body">
      @if (title) {
        <span class="al-title">{{ title }}</span>
      }
      @if (message) {
        <span class="al-message">{{ message }}</span>
      }
      <ng-content></ng-content>
    </div>
    @if (closable) {
      <button type="button" class="al-close" (click)="close()">
        <i class="ri-close-line"></i>
      </button>
    }
  </div>
}
