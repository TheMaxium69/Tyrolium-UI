<div class="tf-wrapper" [ngClass]="wrapperClass">

  <!-- Label flottant -->
  @if (label) {
    <label [for]="inputId" class="tf-label" [class.tf-label--float]="labelFloating">
      {{ label }}
    </label>
  }

  <!-- Zone de saisie -->
  <div class="tf-input-row">
    @if (icon) {
      <i [class]="icon + ' tf-icon-left'"></i>
    }

    <input
      [id]="inputId"
      class="tf-input"
      [type]="currentType"
      [value]="inputValue"
      [placeholder]="labelFloating || !label ? (placeholder ?? '') : ''"
      [disabled]="disabled"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()">

    <!-- Toggle password -->
    @if (type === 'password') {
      <button type="button" class="tf-eye" (click)="showPassword = !showPassword" [disabled]="disabled">
        <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
      </button>
    }
  </div>

  <!-- Message d'erreur -->
  @if (error && errorMessage) {
    <span class="tf-error-msg">
      <i class="ri-error-warning-line"></i>
      {{ errorMessage }}
    </span>
  }

</div>
