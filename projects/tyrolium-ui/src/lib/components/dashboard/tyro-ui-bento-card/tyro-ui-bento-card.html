<div class="bc-card"
     [class.bc-card--small]="size === 'small'"
     [class.bc-card--large]="size === 'large'"
     [class.bc-card--gradient]="gradient"
     [class.bc-card--hoverable]="hoverable || gradient">

  @if (label || title || icon || iconImg) {
    <div class="bc-header">
      <div class="bc-header-left">
        @if (iconImg) {
          <img [src]="iconImg" alt="" class="bc-icon-img">
        } @else if (icon) {
          <i [class]="icon + ' bc-icon'"></i>
        }
        <div class="bc-header-text">
          @if (label) {
            <span class="bc-label">{{ label }}</span>
          }
          @if (title) {
            <p class="bc-title">{{ title }}</p>
          }
        </div>
      </div>
      <ng-content select="[tyro-header-action]"></ng-content>
    </div>
  }

  <div class="bc-body">
    <ng-content></ng-content>
  </div>
</div>
