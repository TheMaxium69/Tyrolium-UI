<button
  type="button"
  role="switch"
  class="sw-track"
  [class.sw-track--on]="value"
  [class.sw-track--disabled]="disabled"
  [attr.aria-checked]="value"
  [disabled]="disabled"
  (click)="toggle()">
  <span class="sw-thumb"></span>
</button>
@if (label) {
  <span class="sw-label" [class.sw-label--disabled]="disabled">{{ label }}</span>
}
