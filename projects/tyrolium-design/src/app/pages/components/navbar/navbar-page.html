<div class="ds-page">

  <hr class="ds-divider">

  <div class="ds-block">
    <span class="ds-label">Aperçu — standalone</span>
    <div class="ds-preview">
      <div class="ds-preview-label">project="Tyrolium" / subtitle="Design"</div>
      <div class="ds-preview-body ds-preview-body--flush">
        <tyro-ui-navbar project="Tyrolium" subtitle="Design"></tyro-ui-navbar>
      </div>
    </div>
  </div>

  <div class="ds-block">
    <span class="ds-label">Aperçu — avec sidebar</span>
    <div class="ds-preview">
      <div class="ds-preview-label">project="Useritium" / subtitle="Dashboard" / [sidebar]="true"</div>
      <div class="ds-preview-body ds-preview-body--flush">
        <tyro-ui-navbar project="Useritium" subtitle="Dashboard" [sidebar]="true"></tyro-ui-navbar>
      </div>
    </div>
  </div>
